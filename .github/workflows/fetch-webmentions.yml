name: Fetch Webmentions

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:  # Allows manual triggering of the workflow if needed

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  fetch_webmentions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch Webmentions
        env:
          WEBMENTION_TOKEN: ${{ secrets.WEBMENTION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WEBMENTION_TOKEN:-}" ]; then
            echo "WEBMENTION_TOKEN is not configured"
            exit 1
          fi
          mkdir -p static/webmention
          temp_file="$(mktemp)"
          trap 'rm -f "$temp_file"' EXIT
          curl --fail --location --silent --show-error \
            --get \
            --data-urlencode "token=${WEBMENTION_TOKEN}" \
            "https://webmention.io/api/mentions.json" \
            -o "$temp_file"
          jq -e 'type == "object" and (.links | type == "array") and all(.links[]; type == "object" and (.source | type == "string") and (.target | type == "string"))' "$temp_file" >/dev/null
          mv "$temp_file" static/webmention/webmentions.json

      - name: Commit and Push Webmentions
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add static/webmention/webmentions.json
          if git diff --cached --quiet; then
            echo "No Webmention changes to commit"
            exit 0
          fi
          git commit -m "Update webmentions"
          git pull --rebase origin main
          git push origin HEAD:main
