name: Build and deploy GH Pages

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build Zola site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Zola version
        id: zola-version
        run: echo "version=$(tr -d '[:space:]' < ZOLA_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check and build Zola site
        uses: getzola/github-pages@435a833fd3f1edcb28d70576c89e30a6365cd8f7
        with:
          zola_version: v${{ steps.zola-version.outputs.version }}
          check_links: true
          check_flags: --skip-external-links

      - name: Validate generated Atom XML and metadata
        run: |
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("public/atom.xml")'
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urlparse

          for path in Path("public").rglob("*.html"):
              source = path.read_text()
              if "<html" not in source or 'name="robots" content="noindex"' in source: continue
              canonical = re.findall(r'<link rel="canonical" href="([^"]+)"', source)
              descriptions = re.findall(r'<meta name="description" content="([^"]*)"', source)
              og_types = re.findall(r'<meta property="og:type" content="([^"]+)"', source)
              json_ld = re.findall(r'<script[^>]+type="application/ld\+json"[^>]*>(.*?)</script>', source, re.S)
              if path.name != "404.html":
                  assert len(canonical) == 1, f"{path}: expected one canonical URL"
                  url = urlparse(canonical[0]); assert url.scheme == "https" and url.netloc == "mikerockwood.com", f"{path}: invalid canonical URL"
              assert len(descriptions) == 1 and descriptions[0].strip(), f"{path}: expected one non-empty description"
              assert len(og_types) == 1 and og_types[0] in ("website", "article", "profile"), f"{path}: invalid Open Graph type"
              assert json_ld, f"{path}: expected JSON-LD"
              for block in json_ld:
                  data = json.loads(block); assert data.get("@context") == "https://schema.org" and data.get("@type") and data.get("url"), f"{path}: incomplete JSON-LD"
          PY

  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
