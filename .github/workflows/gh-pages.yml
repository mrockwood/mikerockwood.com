name: Build and deploy GH Pages

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build Zola site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Zola version
        id: zola-version
        run: echo "version=$(tr -d '[:space:]' < ZOLA_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check and build Zola site
        uses: getzola/github-pages@435a833fd3f1edcb28d70576c89e30a6365cd8f7
        with:
          zola_version: v${{ steps.zola-version.outputs.version }}
          check_links: true
          check_flags: --skip-external-links

      - name: Validate generated Atom XML and JSON-LD
        run: |
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("public/atom.xml")'
          python3 -c 'import json,pathlib,re; blocks=[x for p in pathlib.Path("public").rglob("*.html") for x in re.findall(r"<script type=\"application/ld\+json\">(.*?)</script>", p.read_text(), re.S)]; assert blocks, "No JSON-LD found"; [json.loads(x) for x in blocks]'

  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
