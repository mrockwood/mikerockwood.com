{% extends "posts/single.html" %}

{%- block entry_header %}

	<header>

		<h1 class="p-name">{{ page.title }}</h1>

	</header>
{%- endblock entry_header %}

{%- block entry_content %}

		{%- if page.extra.service == "youtube" -%}
		<iframe
			class="u-video embed-youtube"
			src="https://www.youtube-nocookie.com/embed/{{ page.extra.id }}"
			style="height: 50vw; margin: 1rem 0; max-height: 25rem; width: 100%;"
			frameborder="0"
			allowfullscreen
		></iframe>
		{%- endif -%}

		<div class="e-content">
			{{ page.content | safe }}
		</div>

{%- endblock entry_content %}
