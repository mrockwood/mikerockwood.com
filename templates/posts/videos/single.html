{% extends "base.html" %}

{%- block content %}

<article class="h-entry">
{% include "posts/_microformats.html" %}
	{% if page.date %}<time class="dt-published" datetime="{{ page.date | date(format='%Y-%m-%d %H:%M:%S') }}" hidden>{{ page.date }}</time>{% endif %}

	<header>

		<h1 class="p-name">{{ page.title }}</h1>

	</header>

	<div class="e-content">

		{%- if page.extra.service == "youtube" -%}
		<iframe
			class="embed-youtube"
			src="https://www.youtube-nocookie.com/embed/{{ page.extra.id }}"
			style="height: 50vw; margin: 1rem 0; max-height: 25rem; width: 100%;"
			frameborder="0"
			allowfullscreen
		></iframe>
		{%- endif -%}

		{{ page.content | safe }}

	</div>

</article>

{%- endblock content %}
